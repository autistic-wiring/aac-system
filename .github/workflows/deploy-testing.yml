name: Deploy to Testing (k8s)

# SDLC: every push to a non-main branch builds :testing + :sha-<short> and rolls
# out to aac-testing.nexvision.cc. Merging to main triggers deploy-prod.yml,
# which promotes to aac.nexvision.cc.
#
# Runner: self-hosted k8s runner in openclaw namespace. Kubeconfig is mounted
# from a k8s Secret (see k8s/ci-runner/) — no GitHub Secret needed.

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-testing
  cancel-in-progress: false   # queue superseded pushes instead of killing in-flight builds

permissions:
  contents: read

jobs:
  deploy-testing:
    runs-on: [self-hosted, k8s]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl if missing
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
            curl -fsSL "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl" \
              -o /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
          fi
          kubectl version --client

      - name: Resolve version info
        id: v
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Slug the branch name into a valid image tag (foo/bar -> foo-bar).
          SLUG=$(git rev-parse --abbrev-ref HEAD | tr -c 'a-zA-Z0-9._-' '-' | sed 's/--*/-/g; s/^-//; s/-$//')
          echo "branch=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Wait for Docker daemon
        run: |
          # Fresh ephemeral runner pods start dockerd (dind sidecar) in parallel
          # with the runner; docker build may fire before it is up.
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready"
              exit 0
            fi
            echo "waiting for Docker daemon... (${i}/30)"
            sleep 5
          done
          docker info
          exit 1

      - name: Build & push image
        env:
          REGISTRY: registry.nexvision.cc/nexvisioncc/aac-board
        run: |
          REG="$REGISTRY"
          # docker push is idempotent per tag, so retrying is safe.
          for attempt in 1 2 3; do
            echo "== build+push attempt ${attempt}/3 =="
            if docker build --pull \
              -t "$REG:testing" \
              -t "$REG:sha-${{ steps.v.outputs.sha }}" \
              -t "$REG:branch-${{ steps.v.outputs.branch }}" \
              . \
              && docker push "$REG:testing" \
              && docker push "$REG:sha-${{ steps.v.outputs.sha }}" \
              && docker push "$REG:branch-${{ steps.v.outputs.branch }}"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Apply k8s manifests
        run: |
          # KUBECONFIG is set in the runner pod env, pointing at the mounted
          # Secret from openclaw/aac-deployer-kubeconfig.
          kubectl -n asd apply -f k8s/certificate-testing.yaml
          kubectl -n asd apply -f k8s/deployment-testing.yaml
          kubectl -n asd apply -f k8s/service-testing.yaml
          kubectl -n asd apply -f k8s/ingress-testing.yaml
          kubectl -n asd rollout restart deployment/aac-board-testing
          # rollout status can time out while the saturated single-node cluster
          # schedules/pulls; retry instead of failing the deploy.
          for attempt in $(seq 1 5); do
            if kubectl -n asd rollout status deployment/aac-board-testing --timeout=60s; then
              exit 0
            fi
            echo "rollout not finished (attempt ${attempt}/5), retrying..."
            sleep 5
          done
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to testing"
            echo "URL: https://aac-testing.nexvision.cc"
            echo "Branch: \`${{ steps.v.outputs.branch }}\`"
            echo "Image: \`registry.nexvision.cc/nexvisioncc/aac-board:sha-${{ steps.v.outputs.sha }}\`"
            echo ""
            echo "Smoke-test the URL, then open a PR against \`main\`. Merge will auto-deploy to prod."
          } >> "$GITHUB_STEP_SUMMARY"
