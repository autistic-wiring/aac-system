server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # serve pre-compressed assets if available
    gzip_static on;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # pre-baked TTS audio (cache-busted via ?v=APP_VERSION in speechAdapter)
    location /audio/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # no cache for service worker and manifest
    location ~* (sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
